name: Release

# Solo su tag v* pubblica davvero. Nessun segreto: GitHub Releases usa il
# GITHUB_TOKEN automatico (CLAUDE.md/FASE 8, decisione 6). Niente logica di
# build qui: entrambi i job chiamano tools/release/*.sh.
#
# workflow_dispatch (aggiunto, mai eseguito prima di questa sessione:
# nessun tag e' mai stato pushato su questo repo) serve SOLO a provare che
# build-linux e build-windows producano un binario, senza pubblicare nulla:
# il job `publish` sotto e' guardato con `if: startsWith(github.ref, 'refs/tags/')`
# apposta, quindi un dispatch manuale si ferma prima di quel passo — non
# chiama mai `gh release create`. Un push di tag v* continua a fare tutti e
# tre i job come prima, il guard non cambia niente per quel percorso.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build-linux:
    name: Build Linux (client)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Installa le dipendenze di sistema
        # Stessa lista di ci.yml / tools/release/build_linux.sh — tenerle
        # vicine, si disallineano facilmente. libwayland-dev/libxkbcommon-dev
        # erano mancanti qui (mai arrivate quando sono state aggiunte a
        # ci.yml per il run 35230407346, 2026-09-17): senza, la build fallisce
        # su "fatal error: wayland-version.h" / "xkbcommon/xkbcommon.h"
        # (Irrlicht include sempre CIrrDeviceWayland.h su Linux). Sincronizzata
        # con la lista di ci.yml, non riprogettata.
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libgl1-mesa-dev libglu1-mesa-dev libfreetype-dev libsqlite3-dev \
            libcurl4-openssl-dev libevent-dev libgit2-dev libssh2-1-dev \
            libfmt-dev libflac-dev libvorbis-dev libogg-dev libopenal-dev \
            nlohmann-json3-dev zlib1g-dev build-essential git \
            libx11-dev libxxf86vm-dev libxcursor-dev libxrandr-dev libxi-dev \
            libwayland-dev libxkbcommon-dev

      - name: Risolvi il commit di edo9300/irrlicht1-8-4@1.9-custom
        id: irrlicht-sha
        run: |
          sha="$(git ls-remote https://github.com/edo9300/irrlicht1-8-4.git refs/heads/1.9-custom | cut -f1)"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

      - name: Cache Irrlicht compilato
        uses: actions/cache@v4
        with:
          path: ../irrlicht-custom
          key: irrlicht-linux-${{ steps.irrlicht-sha.outputs.sha }}

      - name: Build
        run: tools/release/build_linux.sh release

      - name: Carica il binario Linux
        uses: actions/upload-artifact@v4
        with:
          name: linux-binary
          path: bin/x64/release/ygoprodll
          if-no-files-found: error

  build-windows:
    name: Build Windows (cross, MinGW)
    runs-on: ubuntu-latest
    steps:
      # submodules: recursive, non true. Il job Linux passa --no-core=true e
      # quindi non se ne accorge, ma qui il core e' linkato staticamente:
      # senza i submodule `ocgcore/` resta vuoto e premake si ferma su
      # "cannot open ocgcore". Ricorsivo perche' ocgcore ha a sua volta
      # lua/src, e senza quello manca lauxlib.h.
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Installa il toolchain MinGW e le dipendenze di sistema
        # `file` serve alla verifica finale di build_windows.sh (D178): lo
        # script controlla che ygopro.exe sia davvero un PE32 e non si fida
        # di un make uscito con 0.
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            g++-mingw-w64-i686 gcc-mingw-w64-i686 unzip file \
            nlohmann-json3-dev build-essential git
        env:
          DEBIAN_FRONTEND: noninteractive

      - name: Risolvi il commit di edo9300/irrlicht1-8-4@1.9-custom
        id: irrlicht-sha
        run: |
          sha="$(git ls-remote https://github.com/edo9300/irrlicht1-8-4.git refs/heads/1.9-custom | cut -f1)"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

      - name: Risolvi il tag piu' recente di edo9300/edopro-vcpkg-cache
        id: vcpkg-tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="$(gh api repos/edo9300/edopro-vcpkg-cache/releases/latest --jq .tag_name)"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Cache Irrlicht sorgente (condivisa con la build Linux)
        uses: actions/cache@v4
        with:
          path: ../irrlicht-custom
          key: irrlicht-linux-${{ steps.irrlicht-sha.outputs.sha }}

      - name: Cache vcpkg precompilato (mingw-static)
        uses: actions/cache@v4
        with:
          path: ../vcpkg-cache
          key: vcpkg-mingw-${{ steps.vcpkg-tag.outputs.tag }}

      - name: Build
        run: tools/release/build_windows.sh release

      # D178: il percorso e' quello che premake produce davvero (bin/release/),
      # non bin/x86/release/ — che era scritto qui e nello script e non
      # corrispondeva a niente, perche' non ci si era mai arrivati.
      - name: Carica il binario Windows
        uses: actions/upload-artifact@v4
        with:
          name: edopro-custom-windows-x86
          path: bin/release/ygopro.exe
          if-no-files-found: error

  publish:
    name: Pubblica la Release
    needs: [build-linux, build-windows]
    # Guard per workflow_dispatch (vedi commento in cima al file): solo un
    # push di tag v* arriva a pubblicare davvero.
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: linux-binary
          path: dist/

      # Solo il nome dell'artefatto, allineato a quello che il job Windows
      # carica ora (D178). Niente altro di questo job e' toccato.
      - uses: actions/download-artifact@v4
        with:
          name: edopro-custom-windows-x86
          path: dist/

      - name: Crea la Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ github.ref_name }}" \
            dist/ygoprodll dist/ygopro.exe \
            --title "${{ github.ref_name }}" \
            --notes "$(cat <<EOF
          Build automatica dal commit \`${{ github.sha }}\` (AGPLv3, sorgente
          completo in questo repository pubblico a quel commit).

          - \`ygoprodll\` — client Linux x64. Da mettere accanto al proprio
            eseguibile \`EDOPro\` (vedi README).
          - \`ygopro.exe\` — client Windows x86, cross-compilato da Linux con
            MinGW. **Mai eseguito su Windows vero**: nessuno lo ha ancora
            provato su hardware reale, trattalo come beta.
          EOF
          )"
