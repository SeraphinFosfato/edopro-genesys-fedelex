name: Release

# Solo su tag v* pubblica davvero. Nessun segreto: GitHub Releases usa il
# GITHUB_TOKEN automatico (CLAUDE.md/FASE 8, decisione 6). Niente logica di
# build qui: entrambi i job chiamano tools/release/*.sh.
#
# workflow_dispatch (aggiunto, mai eseguito prima di questa sessione:
# nessun tag e' mai stato pushato su questo repo) serve SOLO a provare che
# build-linux e build-windows producano un binario, senza pubblicare nulla:
# il job `publish` sotto e' guardato con `if: startsWith(github.ref, 'refs/tags/')`
# apposta, quindi un dispatch manuale si ferma prima di quel passo — non
# chiama mai `gh release create`. Un push di tag v* continua a fare tutti e
# tre i job come prima, il guard non cambia niente per quel percorso.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build-linux:
    name: Build Linux (client)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Installa le dipendenze di sistema
        # Stessa lista di ci.yml / tools/release/build_linux.sh — tenerle
        # vicine, si disallineano facilmente. libwayland-dev/libxkbcommon-dev
        # erano mancanti qui (mai arrivate quando sono state aggiunte a
        # ci.yml per il run 35230407346, 2026-09-17): senza, la build fallisce
        # su "fatal error: wayland-version.h" / "xkbcommon/xkbcommon.h"
        # (Irrlicht include sempre CIrrDeviceWayland.h su Linux). Sincronizzata
        # con la lista di ci.yml, non riprogettata.
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libgl1-mesa-dev libglu1-mesa-dev libfreetype-dev libsqlite3-dev \
            libcurl4-openssl-dev libevent-dev libgit2-dev libssh2-1-dev \
            libfmt-dev libflac-dev libvorbis-dev libogg-dev libopenal-dev \
            nlohmann-json3-dev zlib1g-dev build-essential git \
            libx11-dev libxxf86vm-dev libxcursor-dev libxrandr-dev libxi-dev \
            libwayland-dev libxkbcommon-dev

      - name: Risolvi il commit di edo9300/irrlicht1-8-4@1.9-custom
        id: irrlicht-sha
        run: |
          sha="$(git ls-remote https://github.com/edo9300/irrlicht1-8-4.git refs/heads/1.9-custom | cut -f1)"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

      - name: Cache Irrlicht compilato
        uses: actions/cache@v4
        with:
          path: ../irrlicht-custom
          key: irrlicht-linux-${{ steps.irrlicht-sha.outputs.sha }}

      - name: Build
        run: tools/release/build_linux.sh release

      - name: Carica il binario Linux
        uses: actions/upload-artifact@v4
        with:
          name: linux-binary
          path: bin/x64/release/ygoprodll
          if-no-files-found: error

      # FASE 64 cancello 6 (D244.7): il launcher, quello che il giocatore
      # avvia davvero. Allegato nudo accanto al simulatore nudo: non e' un
      # launcher_files (D244.9, il launcher non si auto-aggiorna), serve
      # solo a chi vuole prenderlo senza installatore/tarball.
      - name: Carica il launcher Linux
        uses: actions/upload-artifact@v4
        with:
          name: linux-launcher-binary
          path: bin/x64/release/fedelex-launcher
          if-no-files-found: error

      # D244 punto 3 (ALLEGATI_LAUNCHER in banlist/scripts/build_update_manifest.py
      # del vault): il launcher scarica FILE SINGOLI per aggiornare
      # (`role: strings`), non archivi. Questo e' lo stesso
      # strings/fedelex.conf gia' dentro il tarball/zip, allegato nudo con
      # lo stesso nome ("fedelex.conf") perche' e' cosi' che
      # ALLEGATI_LAUNCHER lo cerca fra gli asset della release.
      - name: Carica fedelex.conf nudo (per il launcher)
        uses: actions/upload-artifact@v4
        with:
          name: fedelex-conf
          path: strings/fedelex.conf
          if-no-files-found: error

      # Il binario nudo linka le librerie di ubuntu-latest: su Arch/CachyOS
      # il 2026-09-25 non partiva ("libFLAC.so.12: cannot open shared object
      # file"). Il tarball si porta dietro la propria chiusura di dipendenze.
      # Si aggiunge, non sostituisce: chi ha gia' le librerie giuste continua
      # a scaricare il solo ygoprodll.
      - name: Impacchetta il tarball portabile
        run: tools/release/bundle_linux.sh

      - name: Carica il tarball Linux
        uses: actions/upload-artifact@v4
        with:
          name: linux-tarball
          path: tools/release/out/edopro-custom-linux-x64.tar.gz
          if-no-files-found: error

      # FASE 37 (design/client-update.md §7bis): il solo formato che
      # ClientUpdater::Unzip sa installare e' EFAT_ZIP (Utils::UnzipArchive,
      # utils.cpp). Il tarball sopra e il binario nudo restano per chi
      # installa a mano; questo ZIP e' l'unico che un manifesto di
      # aggiornamento puo' nominare. `-j` ("junk path") mette il file alla
      # RADICE dell'archivio invece che sotto bin/x64/release/: e' il
      # percorso relativo alla cartella d'installazione che Unzip si aspetta
      # (l'eseguibile in radice — Utils::GetExePath()). Su Linux il core e'
      # collegato staticamente dentro l'eseguibile (nessuna libocgcore.so a
      # fianco nella release), quindi non c'e' un secondo file da spostare.
      # FASE 40 (ultimo miglio, D202): strings/fedelex.conf viaggia insieme
      # all'eseguibile. -j mette ygoprodll alla RADICE (Utils::GetExePath()),
      # il secondo `zip` (senza -j, lanciato dalla radice del repo) aggiunge
      # fedelex.conf mantenendo il percorso relativo "strings/" dentro
      # l'archivio: e' quello che Utils::UnzipArchive si aspetta per
      # ricreare la sottocartella all'estrazione (verificato leggendo e
      # riproducendo Utils::CreatePath, che cammina i segmenti separati da
      # '/' e chiama MakeDirectory su ognuno prima di scrivere il file).
      - name: Crea lo ZIP per l'aggiornatore
        run: |
          mkdir -p tools/release/out
          rm -f tools/release/out/edopro-custom-linux-x64.zip
          zip -j tools/release/out/edopro-custom-linux-x64.zip bin/x64/release/ygoprodll
          zip tools/release/out/edopro-custom-linux-x64.zip strings/fedelex.conf
          echo "-- contenuto dello ZIP --"
          unzip -l tools/release/out/edopro-custom-linux-x64.zip

      - name: Carica lo ZIP Linux
        uses: actions/upload-artifact@v4
        with:
          name: linux-zip
          path: tools/release/out/edopro-custom-linux-x64.zip
          if-no-files-found: error

  build-windows:
    # D183: si compila su Windows vero, con MSVC, non piu' cross-compilando da
    # Linux. Tutti gli ostacoli del cross-build — le maiuscole degli header, il
    # modello di thread, la versione del CRT, la cache vcpkg incompatibile —
    # erano artefatti del cross-compilare, e qui non esistono. Il percorso
    # cross resta in tools/release/build_windows.sh finche' questo non e'
    # verde: e' l'unica strada che aveva funzionato fin dove aveva funzionato.
    #
    # FASE 60 (D239): il core NON e' piu' collegato dentro l'eseguibile.
    # build_windows.ps1 compila il progetto "ygoprodll" (--no-core=true,
    # YGOPRO_BUILD_DLL) e produce bin/release/ygoprodll.exe: il core viene
    # caricato a runtime dal repository di Project Ignis, come su Linux. Il
    # file distribuito resta ygopro.exe — la rinomina e' un passo di
    # impacchettamento (vedi gli step piu' sotto), non del compilatore. Il
    # runtime resta collegato staticamente (premake5.lua: staticruntime
    # "on"), quindi non c'e' comunque nessun redistribuibile da installare.
    # Cambia il compilatore, non il contratto di distribuzione.
    name: Build Windows (MSVC, x86)
    runs-on: windows-latest
    steps:
      # Niente submodule: con --no-core=true (passato da build_windows.ps1)
      # premake non include piu' il sottoprogetto "ocgcore", quindi non
      # serve il sorgente del core per generare la soluzione. Prima di FASE
      # 60 il core era linkato staticamente e questo checkout doveva essere
      # "submodules: recursive" (il job Linux non ne aveva bisogno perche'
      # gia' passava --no-core=true).
      - uses: actions/checkout@v4

      # Niente installazione di toolchain: il runner Windows monta gia' Visual
      # Studio 2022 e vcpkg. Lo script trova MSBuild con vswhere, cosi' non
      # serve nessuna azione di terze parti ne' un percorso cablato che cambia
      # a ogni aggiornamento dell'immagine.
      #
      # Niente cache, per ora: questo job non ha mai girato, e ogni pezzo in
      # piu' e' un modo in piu' di fallire per una ragione che non c'entra con
      # la build. Si aggiunge quando e' verde, non prima.
      - name: Build
        shell: pwsh
        run: tools/release/build_windows.ps1 release

      # Cancello 2 di FASE 60 (D239): il core NON deve essere collegato
      # dentro questo eseguibile. Solo qui, non nel job Linux — lo stesso
      # script sul binario ygoprodll di Linux cerca "ocgcore.dll" (nome
      # Windows) e fallirebbe sempre, su una build giusta (vedi il
      # docstring dello script e la terza appendice di FASE 60 in
      # PHASES.md). Provato al contrario il 2026-10-02 sull'eseguibile
      # statico di v0.1.1-alpha: rifiuta, nominando le funzioni Lua trovate.
      - name: Verifica che il core non sia collegato dentro
        shell: pwsh
        run: python tools/release/verify_core_not_linked.py bin/release/ygoprodll.exe

      # D178: il percorso e' quello che premake produce davvero (bin/release/),
      # non bin/x86/release/ — che era scritto qui e nello script e non
      # corrispondeva a niente, perche' non ci si era mai arrivati.
      # FASE 60 (D239): il progetto compilato si chiama "ygoprodll", quindi
      # premake emette bin/release/ygoprodll.exe, non piu' ygopro.exe. Questo
      # artefatto di CI resta col nome vero del file prodotto — la rinomina a
      # ygopro.exe avviene solo nei due step di impacchettamento sotto, che
      # sono cio' che finisce davvero nella release.
      - name: Carica il binario Windows
        uses: actions/upload-artifact@v4
        with:
          name: edopro-custom-windows-x86
          path: bin/release/ygoprodll.exe
          if-no-files-found: error

      # FASE 37 (design/client-update.md §7bis): stesso ragionamento del job
      # Linux — lo ZIP contiene un solo eseguibile alla radice (piu' le
      # stringhe), perche' ClientUpdater::Unzip lo estrae accanto
      # all'eseguibile in esecuzione e non gestisce un secondo file.
      # FASE 60 (D239): fino a qui il core era collegato staticamente dentro
      # ygopro.exe, quindi non c'era un core separato da includere o
      # escludere. Da qui in poi il core NON e' piu' dentro l'eseguibile (lo
      # consegna il repository di Project Ignis, D239 — "un solo scrittore
      # per file", MAI ocgcore.dll in questo zip) — e **il file compilato
      # cambia nome**: premake produce ygoprodll.exe (progetto "ygoprodll",
      # non piu' "ygopro"). L'aggiornatore pretende pero' lo stesso nome
      # dell'eseguibile in esecuzione (correzione 024c67cc8, D239), quindi la
      # rinomina a ygopro.exe avviene QUI, copiando il file nello stage con
      # un nome diverso da quello sorgente.
      # FASE 40 (ultimo miglio, D202): strings/fedelex.conf viaggia insieme
      # a ygopro.exe. Compress-Archive non sa mettere un file in una
      # sottocartella dell'archivio mantenendo un altro file alla radice in
      # un colpo solo con -Path multipli (appiattisce), quindi si prepara
      # uno stage con la stessa struttura relativa che l'estrazione deve
      # produrre (exe alla radice, strings/fedelex.conf sotto strings/) e si
      # comprime lo stage intero. Stesso ragionamento del job Linux: verificato
      # leggendo e riproducendo Utils::CreatePath (utils.cpp) che l'estrazione
      # crea le directory intermedie da sola.
      - name: Crea lo ZIP per l'aggiornatore
        shell: pwsh
        run: |
          $stageDir = "tools/release/.stage-windows-zip"
          if (Test-Path $stageDir) { Remove-Item -Recurse -Force $stageDir }
          New-Item -ItemType Directory -Force -Path "$stageDir/strings" | Out-Null
          New-Item -ItemType Directory -Force -Path "$stageDir/bin" | Out-Null
          # D244.7/8: ygopro.exe e' il LAUNCHER, il simulatore sta in bin/.
          # L'aggiornatore interno dei client fino alla build 10 scompatta
          # questo zip accanto all'eseguibile: e' cosi' che il launcher arriva
          # su Windows senza reinstallare. Con il simulatore al posto di
          # ygopro.exe il giocatore resterebbe senza launcher e, da D244.6,
          # senza nessun aggiornamento.
          Copy-Item bin/release/fedelex-launcher.exe -Destination "$stageDir/ygopro.exe"
          Copy-Item bin/release/ygoprodll.exe -Destination "$stageDir/bin/ygoprodll.exe"
          Copy-Item strings/fedelex.conf -Destination "$stageDir/strings/fedelex.conf"

          New-Item -ItemType Directory -Force -Path tools/release/out | Out-Null
          $zipPath = "tools/release/out/edopro-custom-windows-x86.zip"
          if (Test-Path $zipPath) { Remove-Item $zipPath }
          Compress-Archive -Path "$stageDir/*" -DestinationPath $zipPath
          Remove-Item -Recurse -Force $stageDir

          Write-Host "-- contenuto dello ZIP --"
          Expand-Archive -Path $zipPath -DestinationPath tools/release/out/.zip-check -Force
          Get-ChildItem -Recurse tools/release/out/.zip-check | ForEach-Object { Write-Host $_.FullName }
          # D244.7/8 controllato, non ricordato: ygopro.exe dello zip DEVE essere
          # il launcher e il simulatore DEVE stare in bin/.
          $chk = "tools/release/out/.zip-check"
          if ((Get-FileHash "$chk/ygopro.exe").Hash -ne (Get-FileHash bin/release/fedelex-launcher.exe).Hash) { throw "ygopro.exe nello zip non e' il launcher" }
          if ((Get-FileHash "$chk/bin/ygoprodll.exe").Hash -ne (Get-FileHash bin/release/ygoprodll.exe).Hash) { throw "bin/ygoprodll.exe mancante o diverso nello zip" }
          Remove-Item -Recurse -Force tools/release/out/.zip-check

      - name: Carica lo ZIP Windows
        uses: actions/upload-artifact@v4
        with:
          name: windows-zip
          path: tools/release/out/edopro-custom-windows-x86.zip
          if-no-files-found: error

      # D218 punto A / D219: pacchetto Windows PER LE PERSONE, distinto
      # dallo ZIP dell'aggiornatore sopra (che NON si tocca: un manifesto
      # firmato lo nomina, design/client-update.md). Si AGGIUNGE: ygopro.exe
      # nudo non porta strings/fedelex.conf (D202, le etichette del filtro
      # punti restano "???") ne' le licenze delle librerie collegate
      # staticamente (D219, 19 port trovati ispezionando la cache vcpkg).
      # notices-windows/ e' versionato nel repo (non riscaricato in CI, la
      # cache e' 128 MB e cambia raramente): tools/release/gen_windows_notices.py
      # lo rigenera a mano quando la cache vcpkg viene aggiornata.
      # Scritto in Python (non PowerShell puro) perche' windows-latest ha
      # Python 3 preinstallato e lo stesso script e' quello testato in
      # sviluppo su Linux prima che questo job girasse la prima volta.
      # FASE 60 (D239): --exe punta a ygoprodll.exe (il nome che premake
      # produce ora, il simulatore). FASE 64 cancello 6 (D244.7): --launcher-exe
      # punta al launcher appena compilato — package_windows_release.py lo
      # mette alla radice come ygopro.exe (quello che il giocatore avvia) e
      # sposta il simulatore sotto bin/ygoprodll.exe. Mai verificato su un
      # runner Windows vero (nessun toolchain in questo ambiente): la logica
      # di staging e' la stessa testata su Linux con due binari ELF al posto
      # di due PE, vedi il docstring dello script.
      - name: Crea il pacchetto Windows per le persone
        shell: pwsh
        run: |
          python tools/release/package_windows_release.py `
            --exe bin/release/ygoprodll.exe `
            --launcher-exe bin/release/fedelex-launcher.exe `
            --out tools/release/out/edopro-custom-windows-x86-package.zip

      - name: Carica il pacchetto Windows per le persone
        uses: actions/upload-artifact@v4
        with:
          name: windows-package
          path: tools/release/out/edopro-custom-windows-x86-package.zip
          if-no-files-found: error

  publish:
    name: Pubblica la Release
    needs: [build-linux, build-windows]
    # Guard per workflow_dispatch (vedi commento in cima al file): solo un
    # push di tag v* arriva a pubblicare davvero.
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: linux-binary
          path: dist/

      - uses: actions/download-artifact@v4
        with:
          name: linux-tarball
          path: dist/

      # FASE 64 cancello 6 (D244.7/D244.3): il launcher nudo (quello che il
      # giocatore avvia) e il simulatore Windows nudo + fedelex.conf, questi
      # ultimi due per ALLEGATI_LAUNCHER (banlist/scripts/build_update_manifest.py
      # del vault) — il launcher scarica FILE SINGOLI per aggiornarsi, non
      # zip (D244.2), e li cerca fra gli asset della release per nome esatto
      # ("ygoprodll", "ygoprodll.exe", "fedelex.conf"). Prima di D244 il
      # binario Windows nudo non era piu' un allegato (vedi la nota qui
      # sotto sul pacchetto per le persone): resta cosi' per chi installa a
      # mano, ma torna ad essere allegato NUDO per il launcher — ruoli
      # diversi, stesso file.
      - uses: actions/download-artifact@v4
        with:
          name: linux-launcher-binary
          path: dist/

      - uses: actions/download-artifact@v4
        with:
          name: fedelex-conf
          path: dist/

      - uses: actions/download-artifact@v4
        with:
          name: edopro-custom-windows-x86
          path: dist/

      # L'exe nudo NON e' piu' il pacchetto per le persone (dal 2026-09-29):
      # su Windows le librerie di terze parti sono collegate STATICAMENTE
      # dentro l'exe, quindi distribuirlo da solo senza le loro licenze e'
      # un problema; il pacchetto (`-package.zip`) porta `notices/` e resta
      # la via consigliata per un'installazione manuale. L'exe nudo scaricato
      # sopra torna ad essere allegato (FASE 64) ma SOLO come input del
      # launcher (ALLEGATI_LAUNCHER, role "simulator"): non e' nel LEGGIMI,
      # non e' la via consigliata, e' un file che il launcher confronta per
      # hash — non e' pensato per essere aperto a mano.

      # FASE 37: i due ZIP installabili dall'aggiornatore. Allegati IN PIU'
      # rispetto ai file di sempre, mai in sostituzione — chi installa a
      # mano continua a scaricare il tarball/binario nudo di prima. Il
      # manifesto firmato (design/client-update.md, pubblicato separatamente
      # nel vault) e' cio' che indirizza a QUESTI due file.
      - uses: actions/download-artifact@v4
        with:
          name: linux-zip
          path: dist/

      - uses: actions/download-artifact@v4
        with:
          name: windows-zip
          path: dist/

      # D218 punto A / D219: pacchetto Windows per le persone (exe +
      # strings/fedelex.conf + LEGGIMI.txt + notices/). AGGIUNTO, non in
      # sostituzione di ygopro.exe nudo sopra.
      - uses: actions/download-artifact@v4
        with:
          name: windows-package
          path: dist/

      - name: Crea la Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ github.ref_name }}" \
            dist/ygoprodll dist/edopro-custom-linux-x64.tar.gz \
            dist/edopro-custom-linux-x64.zip dist/edopro-custom-windows-x86.zip \
            dist/edopro-custom-windows-x86-package.zip \
            dist/fedelex-launcher dist/ygoprodll.exe dist/fedelex.conf \
            --title "${{ github.ref_name }}" \
            --notes "$(cat <<EOF
          Build automatica dal commit \`${{ github.sha }}\` (AGPLv3, sorgente
          completo in questo repository pubblico a quel commit).

          - \`edopro-custom-linux-x64.tar.gz\` — **client Linux x64, da
            preferire per un'installazione manuale.** Contiene \`ygoprodll\`
            e una cartella \`lib/\` con le librerie che la distribuzione
            dell'utente potrebbe non avere, o avere con un SONAME diverso. Si
            copiano entrambi accanto al proprio eseguibile \`EDOPro\`.
            Istruzioni in \`LEGGIMI.txt\`.
          - \`ygoprodll\` — lo stesso binario, nudo. Linka le librerie di
            ubuntu-latest: su una distribuzione diversa puo' non partire
            affatto (\`error while loading shared libraries\`). Resta qui per
            chi ha gia' le librerie giuste.
          - \`edopro-custom-linux-x64.zip\` / \`edopro-custom-windows-x86.zip\`
            — stessi eseguibili di sopra, impacchettati nel solo formato che
            l'aggiornatore integrato sa installare da solo (ZIP). Non
            scaricarli a mano: sono per il manifesto di aggiornamento
            firmato, non hanno la chiusura di dipendenze del tarball Linux.
          - \`edopro-custom-windows-x86-package.zip\` — **client Windows
            x86, da preferire per un'installazione manuale.** Contiene
            \`ygopro.exe\`, \`strings/fedelex.conf\` (senza, le etichette
            del filtro punti restano "???") e \`notices/\` con le licenze
            delle librerie collegate staticamente. Istruzioni in
            \`LEGGIMI.txt\` dentro il pacchetto.
          - \`fedelex-launcher\` — il launcher Linux nudo (quello che il
            giocatore avvia, design/launcher.md). E' gia' dentro il tarball
            sopra: questo allegato serve solo a chi vuole prenderlo da
            solo.
          - \`ygoprodll.exe\` / \`fedelex.conf\` — allegati nudi SOLO per il
            launcher (si auto-aggiorna confrontando questi file per hash,
            D244): non sono pensati per essere scaricati a mano, non hanno
            licenze ne' istruzioni allegate.
          EOF
          )"
