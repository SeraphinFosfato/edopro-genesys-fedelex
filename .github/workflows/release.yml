name: Release

# Solo su tag v* pubblica davvero. Nessun segreto: GitHub Releases usa il
# GITHUB_TOKEN automatico (CLAUDE.md/FASE 8, decisione 6). Niente logica di
# build qui: entrambi i job chiamano tools/release/*.sh.
#
# workflow_dispatch (aggiunto, mai eseguito prima di questa sessione:
# nessun tag e' mai stato pushato su questo repo) serve SOLO a provare che
# build-linux e build-windows producano un binario, senza pubblicare nulla:
# il job `publish` sotto e' guardato con `if: startsWith(github.ref, 'refs/tags/')`
# apposta, quindi un dispatch manuale si ferma prima di quel passo — non
# chiama mai `gh release create`. Un push di tag v* continua a fare tutti e
# tre i job come prima, il guard non cambia niente per quel percorso.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build-linux:
    name: Build Linux (client)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Installa le dipendenze di sistema
        # Stessa lista di ci.yml / tools/release/build_linux.sh — tenerle
        # vicine, si disallineano facilmente. libwayland-dev/libxkbcommon-dev
        # erano mancanti qui (mai arrivate quando sono state aggiunte a
        # ci.yml per il run 35230407346, 2026-09-17): senza, la build fallisce
        # su "fatal error: wayland-version.h" / "xkbcommon/xkbcommon.h"
        # (Irrlicht include sempre CIrrDeviceWayland.h su Linux). Sincronizzata
        # con la lista di ci.yml, non riprogettata.
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libgl1-mesa-dev libglu1-mesa-dev libfreetype-dev libsqlite3-dev \
            libcurl4-openssl-dev libevent-dev libgit2-dev libssh2-1-dev \
            libfmt-dev libflac-dev libvorbis-dev libogg-dev libopenal-dev \
            nlohmann-json3-dev zlib1g-dev build-essential git \
            libx11-dev libxxf86vm-dev libxcursor-dev libxrandr-dev libxi-dev \
            libwayland-dev libxkbcommon-dev

      - name: Risolvi il commit di edo9300/irrlicht1-8-4@1.9-custom
        id: irrlicht-sha
        run: |
          sha="$(git ls-remote https://github.com/edo9300/irrlicht1-8-4.git refs/heads/1.9-custom | cut -f1)"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

      - name: Cache Irrlicht compilato
        uses: actions/cache@v4
        with:
          path: ../irrlicht-custom
          key: irrlicht-linux-${{ steps.irrlicht-sha.outputs.sha }}

      - name: Build
        run: tools/release/build_linux.sh release

      - name: Carica il binario Linux
        uses: actions/upload-artifact@v4
        with:
          name: linux-binary
          path: bin/x64/release/ygoprodll
          if-no-files-found: error

      # Il binario nudo linka le librerie di ubuntu-latest: su Arch/CachyOS
      # il 2026-09-25 non partiva ("libFLAC.so.12: cannot open shared object
      # file"). Il tarball si porta dietro la propria chiusura di dipendenze.
      # Si aggiunge, non sostituisce: chi ha gia' le librerie giuste continua
      # a scaricare il solo ygoprodll.
      - name: Impacchetta il tarball portabile
        run: tools/release/bundle_linux.sh

      - name: Carica il tarball Linux
        uses: actions/upload-artifact@v4
        with:
          name: linux-tarball
          path: tools/release/out/edopro-custom-linux-x64.tar.gz
          if-no-files-found: error

      # FASE 37 (design/client-update.md §7bis): il solo formato che
      # ClientUpdater::Unzip sa installare e' EFAT_ZIP (Utils::UnzipArchive,
      # utils.cpp). Il tarball sopra e il binario nudo restano per chi
      # installa a mano; questo ZIP e' l'unico che un manifesto di
      # aggiornamento puo' nominare. `-j` ("junk path") mette il file alla
      # RADICE dell'archivio invece che sotto bin/x64/release/: e' il
      # percorso relativo alla cartella d'installazione che Unzip si aspetta
      # (l'eseguibile in radice — Utils::GetExePath()). Su Linux il core e'
      # collegato staticamente dentro l'eseguibile (nessuna libocgcore.so a
      # fianco nella release), quindi non c'e' un secondo file da spostare.
      - name: Crea lo ZIP per l'aggiornatore
        run: |
          mkdir -p tools/release/out
          rm -f tools/release/out/edopro-custom-linux-x64.zip
          zip -j tools/release/out/edopro-custom-linux-x64.zip bin/x64/release/ygoprodll
          echo "-- contenuto dello ZIP --"
          unzip -l tools/release/out/edopro-custom-linux-x64.zip

      - name: Carica lo ZIP Linux
        uses: actions/upload-artifact@v4
        with:
          name: linux-zip
          path: tools/release/out/edopro-custom-linux-x64.zip
          if-no-files-found: error

  build-windows:
    # D183: si compila su Windows vero, con MSVC, non piu' cross-compilando da
    # Linux. Tutti gli ostacoli del cross-build — le maiuscole degli header, il
    # modello di thread, la versione del CRT, la cache vcpkg incompatibile —
    # erano artefatti del cross-compilare, e qui non esistono. Il percorso
    # cross resta in tools/release/build_windows.sh finche' questo non e'
    # verde: e' l'unica strada che aveva funzionato fin dove aveva funzionato.
    #
    # Cio' che si distribuisce non cambia: sempre bin/release/ygopro.exe, x86,
    # col core e il runtime collegati staticamente dentro (premake5.lua:
    # staticruntime "on"), nessun file a fianco e nessun redistribuibile da
    # installare. Cambia il compilatore, non il file.
    name: Build Windows (MSVC, x86)
    runs-on: windows-latest
    steps:
      # submodules: recursive, non true. Il job Linux passa --no-core=true e
      # quindi non se ne accorge, ma qui il core e' linkato staticamente:
      # senza i submodule `ocgcore/` resta vuoto e premake si ferma su
      # "cannot open ocgcore". Ricorsivo perche' ocgcore ha a sua volta
      # lua/src, e senza quello manca lauxlib.h.
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      # Niente installazione di toolchain: il runner Windows monta gia' Visual
      # Studio 2022 e vcpkg. Lo script trova MSBuild con vswhere, cosi' non
      # serve nessuna azione di terze parti ne' un percorso cablato che cambia
      # a ogni aggiornamento dell'immagine.
      #
      # Niente cache, per ora: questo job non ha mai girato, e ogni pezzo in
      # piu' e' un modo in piu' di fallire per una ragione che non c'entra con
      # la build. Si aggiunge quando e' verde, non prima.
      - name: Build
        shell: pwsh
        run: tools/release/build_windows.ps1 release

      # D178: il percorso e' quello che premake produce davvero (bin/release/),
      # non bin/x86/release/ — che era scritto qui e nello script e non
      # corrispondeva a niente, perche' non ci si era mai arrivati.
      - name: Carica il binario Windows
        uses: actions/upload-artifact@v4
        with:
          name: edopro-custom-windows-x86
          path: bin/release/ygopro.exe
          if-no-files-found: error

      # FASE 37 (design/client-update.md §7bis): stesso ragionamento del job
      # Linux. Qui il core E' collegato staticamente dentro ygopro.exe (vedi
      # il commento in cima a questo job e build_windows.ps1: "nessuna
      # ocgcore.dll a fianco"), quindi anche su Windows lo ZIP contiene un
      # solo file alla radice — non c'e' un core separato che
      # ClientUpdater::Unzip debba spostare per questa build. Se in futuro il
      # core tornasse un .dll a fianco, questo passo va rifatto per includerlo
      # (e quel cambio tocca ClientUpdater::Unzip, non solo lo ZIP: vedi i
      # punti di risalita di FASE 37 in PHASES.md).
      - name: Crea lo ZIP per l'aggiornatore
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path tools/release/out | Out-Null
          $zipPath = "tools/release/out/edopro-custom-windows-x86.zip"
          if (Test-Path $zipPath) { Remove-Item $zipPath }
          Compress-Archive -Path bin/release/ygopro.exe -DestinationPath $zipPath
          Write-Host "-- contenuto dello ZIP --"
          Expand-Archive -Path $zipPath -DestinationPath tools/release/out/.zip-check -Force
          Get-ChildItem -Recurse tools/release/out/.zip-check | ForEach-Object { Write-Host $_.FullName }
          Remove-Item -Recurse -Force tools/release/out/.zip-check

      - name: Carica lo ZIP Windows
        uses: actions/upload-artifact@v4
        with:
          name: windows-zip
          path: tools/release/out/edopro-custom-windows-x86.zip
          if-no-files-found: error

  publish:
    name: Pubblica la Release
    needs: [build-linux, build-windows]
    # Guard per workflow_dispatch (vedi commento in cima al file): solo un
    # push di tag v* arriva a pubblicare davvero.
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: linux-binary
          path: dist/

      - uses: actions/download-artifact@v4
        with:
          name: linux-tarball
          path: dist/

      # Solo il nome dell'artefatto, allineato a quello che il job Windows
      # carica ora (D178). Niente altro di questo job e' toccato.
      - uses: actions/download-artifact@v4
        with:
          name: edopro-custom-windows-x86
          path: dist/

      # FASE 37: i due ZIP installabili dall'aggiornatore. Allegati IN PIU'
      # rispetto ai file di sempre, mai in sostituzione — chi installa a
      # mano continua a scaricare il tarball/binario nudo di prima. Il
      # manifesto firmato (design/client-update.md, pubblicato separatamente
      # nel vault) e' cio' che indirizza a QUESTI due file.
      - uses: actions/download-artifact@v4
        with:
          name: linux-zip
          path: dist/

      - uses: actions/download-artifact@v4
        with:
          name: windows-zip
          path: dist/

      - name: Crea la Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ github.ref_name }}" \
            dist/ygoprodll dist/edopro-custom-linux-x64.tar.gz dist/ygopro.exe \
            dist/edopro-custom-linux-x64.zip dist/edopro-custom-windows-x86.zip \
            --title "${{ github.ref_name }}" \
            --notes "$(cat <<EOF
          Build automatica dal commit \`${{ github.sha }}\` (AGPLv3, sorgente
          completo in questo repository pubblico a quel commit).

          - \`edopro-custom-linux-x64.tar.gz\` — **client Linux x64, da
            preferire per un'installazione manuale.** Contiene \`ygoprodll\`
            e una cartella \`lib/\` con le librerie che la distribuzione
            dell'utente potrebbe non avere, o avere con un SONAME diverso. Si
            copiano entrambi accanto al proprio eseguibile \`EDOPro\`.
            Istruzioni in \`LEGGIMI.txt\`.
          - \`ygoprodll\` — lo stesso binario, nudo. Linka le librerie di
            ubuntu-latest: su una distribuzione diversa puo' non partire
            affatto (\`error while loading shared libraries\`). Resta qui per
            chi ha gia' le librerie giuste.
          - \`ygopro.exe\` — client Windows x86, compilato su Windows con
            MSVC (D183). Un file solo, autosufficiente: non serve installare
            nessun redistribuibile. **Mai eseguito su Windows vero**:
            compilarlo su Windows non e' averlo provato su Windows, e
            nessuno lo ha ancora aperto su hardware reale. Trattalo come
            beta.
          - \`edopro-custom-linux-x64.zip\` / \`edopro-custom-windows-x86.zip\`
            — stessi eseguibili di sopra, impacchettati nel solo formato che
            l'aggiornatore integrato sa installare da solo (ZIP). Non
            scaricarli a mano: sono per il manifesto di aggiornamento
            firmato, non hanno la chiusura di dipendenze del tarball Linux.
          EOF
          )"
