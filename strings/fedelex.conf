# System strings this fork adds on top of upstream EDOPro / Project Ignis.
#
# FASE 40.2 (D202): codes 3315 ("Points:") and 3316 ("Stats:") label the
# custom point-list filter fields (gframe/game.cpp, stCost/stAttack). They
# used to exist only in config/strings.conf on one developer's disk - an
# EXISTING EDOPro installation this client is dropped into (see
# tools/release/bundle_linux.sh's LEGGIMI.txt), which is gitignored
# (runtime/, .gitignore) and never redistributed by this repo. A player who
# never had those two lines added to THEIR own install - i.e. everyone -
# saw "???" (DataManager::unknown_string), in every language including
# English: not a translation gap, a missing base value.
#
# Loaded via DataManager::LoadStrings, same "!system <code> <text>" format
# as upstream's config/strings.conf (data_manager.cpp:227). Parsed as UTF-8.
# Only add codes THIS fork owns; a code Project Ignis later claims for real
# wins over this file (see the load order in gframe/data_handler.cpp).
!system 3315 Points:
!system 3316 Stats:

# FASE 75b, design/decisioni.md D252 (design/server-duelli.md §13.5): the
# ONE question a tournament room (a room joined through the fedelex://
# link, FASE 75) ever asks for an optional chain window or an optional
# triggered effect -- worded so it never hints at a card's name, its
# location, or whether there is even anything there to use at all. See
# gframe/duelclient.cpp's MSG_SELECT_CHAIN/MSG_SELECT_EFFECTYN handling and
# gframe/tournament_mode.h. English only, same reasoning as 3315/3316 above
# (no per-language override mechanism here, data_handler.cpp's LoadStrings
# vs LoadLocaleStrings) -- these codes (1393-1399) sit in a genuine gap in
# upstream's own numbering (1392 "Waiting....." to 1400 "Unable to connect
# to the host."), verified empty in config/strings.conf before picking them.
!system 1395 Do you want to activate an effect?
# Button label for the pause this generic question opens into once "Si'"
# is answered: the player must find and click the actual card themselves
# (gframe/event_handler.cpp's ShowCancelOrFinishButton, buttonOp 3).
!system 1396 I'm not activating anything

